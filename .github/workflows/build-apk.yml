name: Build Android APK
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
 
      - name: Installer Java (requis par Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
 
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
 
      - name: Générer les dossiers Android manquants
        run: flutter create --platforms=android --org com.cervixhealth .
 
      - name: Installer les dépendances du projet
        run: flutter pub get
 
      - name: Compiler l'APK (release)
        run: flutter build apk --release
 
      - name: Publier l'APK comme "artifact" téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
