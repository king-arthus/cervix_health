name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Java (requis par Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer le dossier Android natif (une seule fois, s'il n'existe pas encore)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.cervixhealth .
          fi

      - name: Vérifier/ajouter la permission INTERNET (requise en release)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$MANIFEST"
          fi
          sed -i 's/android:label="cervix_health"/android:label="Cervix Health"/' "$MANIFEST"
          echo "--- AndroidManifest.xml (début) ---"
          head -n 10 "$MANIFEST"

      - name: Corriger le build.gradle (desugaring + compileSdk 36 pour file_picker)
        run: |
          python3 - <<'PYEOF'
          import os

          path_kts = "android/app/build.gradle.kts"
          path_groovy = "android/app/build.gradle"
          if os.path.exists(path_kts):
              path = path_kts
              kotlin = True
          else:
              path = path_groovy
              kotlin = False

          with open(path) as f:
              content = f.read()

          MARKER = "// CERVIX_HEALTH_CI_PATCH"
          if MARKER not in content:
              if kotlin:
                  lines = [
                      "",
                      MARKER,
                      "android {",
                      "    compileSdk = 36",
                      "    compileOptions {",
                      "        isCoreLibraryDesugaringEnabled = true",
                      "    }",
                      "}",
                      "",
                      "dependencies {",
                      '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      "}",
                      "",
                  ]
              else:
                  lines = [
                      "",
                      MARKER,
                      "android {",
                      "    compileSdkVersion 36",
                      "    compileOptions {",
                      "        coreLibraryDesugaringEnabled true",
                      "    }",
                      "}",
                      "",
                      "dependencies {",
                      "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      "}",
                      "",
                  ]
              content += "\n".join(lines)
              with open(path, "w") as f:
                  f.write(content)
              print("Patched (appended) " + path)
          else:
              print("Already patched, skipping: " + path)
          PYEOF
          echo "--- Contenu final ---"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      - name: Installer les dépendances du projet
        run: flutter pub get

      - name: Forcer un compileSdk/targetSdk récent pour TOUS les modules (app + plugins)
        run: |
          PROPS="android/local.properties"
          touch "$PROPS"
          grep -q "^flutter.compileSdkVersion=" "$PROPS" || echo "flutter.compileSdkVersion=36" >> "$PROPS"
          grep -q "^flutter.targetSdkVersion=" "$PROPS" || echo "flutter.targetSdkVersion=36" >> "$PROPS"
          echo "--- local.properties ---"
          cat "$PROPS"

      - name: Générer l'icône personnalisée de l'application
        run: dart run flutter_launcher_icons

      - name: Enregistrer le dossier Android généré/modifié dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --quiet || git commit -m "chore: generate/patch native Android project + app icon [skip ci]"
          git push || true

      - name: Compiler l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK comme "artifact" téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
