name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Java (requis par Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer le dossier Android natif (une seule fois, s'il n'existe pas encore)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.cervixhealth .
          fi

      - name: Activer le "core library desugaring" requis par les notifications
        run: |
          python3 - <<'PYEOF'
          import re

          path = "android/app/build.gradle.kts"
          try:
              with open(path) as f:
                  content = f.read()
              kotlin = True
          except FileNotFoundError:
              path = "android/app/build.gradle"
              with open(path) as f:
                  content = f.read()
              kotlin = False

          if "CoreLibraryDesugaringEnabled" not in content:
              flag = "isCoreLibraryDesugaringEnabled = true" if kotlin else "coreLibraryDesugaringEnabled true"
              content = re.sub(r'(compileOptions\s*\{)', r'\1\n        ' + flag, content, count=1)

          if "coreLibraryDesugaring" not in content or "desugar_jdk_libs" not in content:
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kotlin \
                  else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if re.search(r'dependencies\s*\{', content):
                  content = re.sub(r'(dependencies\s*\{)', r'\1\n    ' + dep, content, count=1)
              else:
                  content += '\n\ndependencies {\n    ' + dep + '\n}\n'

          with open(path, "w") as f:
              f.write(content)
          print(f"Patched {path}")
          PYEOF
          echo "--- Contenu final de build.gradle(.kts) ---"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      - name: Enregistrer le dossier Android généré/modifié dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --quiet || git commit -m "chore: generate/patch native Android project [skip ci]"
          git push || true

      - name: Installer les dépendances du projet
        run: flutter pub get

      - name: Compiler l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK comme "artifact" téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
