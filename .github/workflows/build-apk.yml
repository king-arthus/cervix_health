name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Java (requis par Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer le dossier Android natif (une seule fois, s'il n'existe pas encore)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.cervixhealth .
          fi

      - name: Vérifier/ajouter la permission INTERNET (requise en release)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$MANIFEST"
          fi
          sed -i 's/android:label="cervix_health"/android:label="Cervix Health"/' "$MANIFEST"
          echo "--- AndroidManifest.xml (début) ---"
          head -n 10 "$MANIFEST"

      - name: Activer le "core library desugaring" requis par les notifications
        run: |
          python3 - <<'PYEOF'
          import re

          path = "android/app/build.gradle.kts"
          try:
              with open(path) as f:
                  content = f.read()
              kotlin = True
          except FileNotFoundError:
              path = "android/app/build.gradle"
              with open(path) as f:
                  content = f.read()
              kotlin = False

          if "CoreLibraryDesugaringEnabled" not in content:
              flag = "isCoreLibraryDesugaringEnabled = true" if kotlin else "coreLibraryDesugaringEnabled true"
              content = re.sub(r'(compileOptions\s*\{)', r'\1\n        ' + flag, content, count=1)

          if "coreLibraryDesugaring" not in content or "desugar_jdk_libs" not in content:
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kotlin \
                  else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if re.search(r'dependencies\s*\{', content):
                  content = re.sub(r'(dependencies\s*\{)', r'\1\n    ' + dep, content, count=1)
              else:
                  content += '\n\ndependencies {\n    ' + dep + '\n}\n'

          # file_picker exige un compileSdk >= 36 : on force cette valeur plutôt
          # que de dépendre de la valeur par défaut fournie par Flutter.
          if kotlin:
              content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', content)
              if 'compileSdk = 36' not in content:
                  content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
          else:
              content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', content)
              if 'compileSdkVersion 36' not in content:
                  content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)

          with open(path, "w") as f:
              f.write(content)
          print(f"Patched {path}")
          PYEOF
          echo "--- compileSdk actuel ---"
          grep -i "compileSdk" android/app/build.gradle.kts 2>/dev/null || grep -i "compileSdk" android/app/build.gradle

      - name: Installer les dépendances du projet
        run: flutter pub get

      - name: Générer l'icône personnalisée de l'application
        run: dart run flutter_launcher_icons

      - name: Enregistrer le dossier Android généré/modifié dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --quiet || git commit -m "chore: generate/patch native Android project + app icon [skip ci]"
          git push || true

      - name: Compiler l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK comme "artifact" téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
